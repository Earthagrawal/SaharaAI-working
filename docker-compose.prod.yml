version: '3.9'
services:
  backend:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    environment:
      - APP_ENV=production
      - MOCK_MODE=${MOCK_MODE}
  frontend:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M


