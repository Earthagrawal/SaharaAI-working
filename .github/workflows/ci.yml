name: CI
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt ruff black
      - name: Lint backend
        run: |
          ruff check backend
          black --check backend
      - name: Test backend
        env:
          MOCK_MODE: "true"
        run: pytest -q backend/tests
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Frontend deps
        run: |
          cd frontend
          npm ci || npm install
      - name: Frontend lint & typecheck
        run: |
          cd frontend
          npm run lint && npm run typecheck
      - name: Build images
        run: |
          docker build -t sahara-backend:ci backend
          docker build -t sahara-frontend:ci frontend


